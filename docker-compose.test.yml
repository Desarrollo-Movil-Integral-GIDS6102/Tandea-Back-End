# PostgreSQL desechable para las pruebas de integración (SP-3 QA-ENTREGA).
#   docker compose -f docker-compose.test.yml up -d
#   TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5433/tandea_test npm run test:e2e
#   docker compose -f docker-compose.test.yml down -v
services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tandea_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tandea_test']
      interval: 2s
      timeout: 3s
      retries: 15
